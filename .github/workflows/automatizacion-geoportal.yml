# Automatización del geoportal MIT Zonal 7
#  - Cada hora: carga en la base de datos las fichas de campo nuevas de KoboToolbox (con sus fotos).
#  - Lunes y jueves: copia de seguridad de la base en la carpeta respaldo_bd del repositorio.
# Ambas tareas mantienen activo el proyecto gratuito de Supabase.
# También se pueden ejecutar a mano: pestaña Actions > "Automatización del geoportal" > Run workflow.
name: Automatización del geoportal

on:
  schedule:
    - cron: '17 * * * *'      # cada hora: ficha de campo
    - cron: '23 3 * * 1,4'    # lunes y jueves 03:23 UTC (22:23 de Ecuador del día anterior): respaldo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ficha-de-campo:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cargar fichas de KoboToolbox en Supabase
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_URL: ${{ secrets.KOBO_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/sincronizar_kobo.py

  respaldo:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 * * 1,4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar las tablas de Supabase
        run: python scripts/respaldo_bd.py
      - name: Guardar el respaldo en el repositorio
        run: |
          git config user.name "respaldo-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add respaldo_bd
          git commit -m "Respaldo automático de la base de datos" || echo "Sin cambios"
          git pull --rebase
          git push
